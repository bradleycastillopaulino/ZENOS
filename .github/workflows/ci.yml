name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Pruebas y instalador (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend (TypeScript + Vite)
        run: npm run build

      - name: Tests de Rust (incluye voz de Windows y Administrador de credenciales)
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Generar instalador
        run: npx tauri build

      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AI-Star-instalador-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publicar versión portable (sin instalar)
        uses: actions/upload-artifact@v4
        with:
          name: AI-Star-portable-windows
          path: src-tauri/target/release/ai-star.exe
          if-no-files-found: error
